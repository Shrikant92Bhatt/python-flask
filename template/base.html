<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="{% block meta_description %}Modern, high-performance Python Flask multi-page static website with glassmorphism UI.{% endblock %}">
    <title>{% block title %}FlaskCraft | Modern Web App{% endblock %}</title>

    <!-- Google Fonts for Modern Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Asset 1 (Direct Path): Favicon loaded directly from /static/images/favicon.svg -->
    <link rel="icon" type="image/svg+xml" href="/static/images/favicon.svg">

    <!-- Asset 2 (url_for helper): Global Base Stylesheet (Variables, Reset, Layout, Header, Footer, Toasts) -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">

    <!-- Page-Specific Modular Stylesheet Slot (Loaded directly per template) -->
    {% block extra_css %}{% endblock %}

    <!-- Block for child templates to inject additional head tags/meta -->
    {% block extra_head %}{% endblock %}
</head>
<body>
    <!-- Separate Header/Navbar Component File -->
    {% include 'components/navbar.html' %}

    <!-- Global Floating Toast Notification Component -->
    {% include 'components/toast.html' %}

    <!-- Page Specific Main Content Slot -->
    <main>
        {% block content %}{% endblock %}
    </main>

    <!-- Separate Footer Component File -->
    {% include 'components/footer.html' %}

    <!-- Asset 3 (Direct Path): Client JS asset loaded from /static/js/main.js -->
    <script src="/static/js/main.js"></script>

    <!-- Page Specific Scripts Slot -->
    {% block scripts %}{% endblock %}
</body>
</html>
